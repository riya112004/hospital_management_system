<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Record and preview audio for a clinical note."
    />
    <title>Clinical Note Recorder</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #172b3a;
        background: #f3f7f8;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        background:
          radial-gradient(ellipse at 10% 0%, #e1f3f0 0, transparent 38%),
          #f3f7f8;
      }

      main {
        width: min(100%, 560px);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #167c72;
        font-size: 0.75rem;
        font-weight: 750;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 5vw, 2.25rem);
        letter-spacing: -0.045em;
      }

      .intro {
        margin: 9px 0 24px;
        color: #60717e;
        line-height: 1.55;
      }

      .recorder-card {
        padding: clamp(22px, 6vw, 34px);
        border: 1px solid #e1e9eb;
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 18px 50px rgb(34 67 79 / 9%);
      }

      .timer {
        margin: 0;
        color: #102b38;
        font-size: clamp(3.5rem, 15vw, 5rem);
        font-variant-numeric: tabular-nums;
        font-weight: 680;
        letter-spacing: -0.075em;
        line-height: 1.1;
        text-align: center;
      }

      .status {
        min-height: 24px;
        margin: 12px 0 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        color: #60717e;
        font-size: 0.95rem;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #93a2a9;
      }

      .status[data-state="recording"] {
        color: #b42332;
      }

      .status[data-state="recording"] .status-dot {
        background: #d83a4b;
        box-shadow: 0 0 0 4px #fce8ea;
        animation: pulse 1.5s ease-in-out infinite;
      }

      .status[data-state="ready"] {
        color: #167c55;
      }

      .status[data-state="ready"] .status-dot {
        background: #20a36b;
      }

      .status[data-state="error"] {
        color: #b42332;
      }

      .status[data-state="error"] .status-dot {
        background: #d83a4b;
      }

      @keyframes pulse {
        50% {
          box-shadow: 0 0 0 7px rgb(216 58 75 / 10%);
        }
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }

      .language-control {
        display: grid;
        gap: 7px;
        width: min(100%, 320px);
        margin: 0 auto 18px;
        color: #425765;
        font-size: 0.9rem;
        font-weight: 650;
      }

      .language-control select {
        min-height: 44px;
        padding: 8px 12px;
        border: 1px solid #cbd9dc;
        border-radius: 10px;
        color: #172b3a;
        background: #fff;
        font: inherit;
      }

      .language-control select:focus-visible {
        outline: 3px solid #72c9bf;
        outline-offset: 3px;
      }

      .language-control select:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      .live-monitor {
        width: min(100%, 320px);
        margin: 0 auto 18px;
      }

      .live-monitor-header {
        margin-bottom: 7px;
        display: flex;
        justify-content: space-between;
        gap: 12px;
        color: #425765;
        font-size: 0.85rem;
      }

      .live-connection-state[data-state="connecting"],
      .live-connection-state[data-state="lagging"] {
        color: #9a5b00;
      }

      .live-connection-state[data-state="listening"] {
        color: #167c55;
      }

      .live-connection-state[data-state="unavailable"] {
        color: #b42332;
      }

      .microphone-meter {
        height: 12px;
        overflow: hidden;
        border-radius: 999px;
        background: #e6edef;
      }

      .microphone-meter-fill {
        width: 0;
        height: 100%;
        border-radius: inherit;
        background: #20a36b;
        transition: width 80ms linear;
      }

      button {
        min-height: 48px;
        padding: 0 20px;
        border: 0;
        border-radius: 12px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 120ms ease,
          background-color 120ms ease,
          box-shadow 120ms ease;
      }

      button:not(:disabled):active {
        transform: translateY(1px);
      }

      button:focus-visible {
        outline: 3px solid #72c9bf;
        outline-offset: 3px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }

      .start-button {
        color: #fff;
        background: #147d72;
        box-shadow: 0 5px 12px rgb(20 125 114 / 18%);
      }

      .start-button:not(:disabled):hover {
        background: #106b62;
      }

      .stop-button {
        color: #fff;
        background: #c33b49;
      }

      .stop-button:not(:disabled):hover {
        background: #aa2e3b;
      }

      .pause-button,
      .transcript-action {
        color: #176f65;
        background: #e8f5f2;
      }

      .pause-button:not(:disabled):hover,
      .transcript-action:not(:disabled):hover {
        background: #d9efea;
      }

      .preview {
        margin-top: 20px;
        padding: 22px;
        border: 1px solid #e1e9eb;
        border-radius: 18px;
        background: #fff;
      }

      .preview-heading {
        margin: 0 0 14px;
        font-size: 1rem;
      }

      .audio-name {
        margin: 0 0 12px;
        color: #334b59;
        font-size: 0.9rem;
        font-weight: 650;
      }

      audio {
        width: 100%;
        height: 44px;
      }

      .transcript-box {
        width: 100%;
        min-height: 132px;
        padding: 12px 14px;
        border: 1px solid #d5e0e3;
        border-radius: 12px;
        color: #334b59;
        background: #fbfdfd;
        font: inherit;
        line-height: 1.55;
        resize: vertical;
      }

      .transcript-box:focus-visible {
        outline: 3px solid #72c9bf;
        outline-offset: 2px;
      }

      .transcript-actions {
        margin-top: 10px;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .transcript-action {
        min-height: 42px;
        padding: 0 15px;
      }

      .preview-placeholder {
        margin: 0;
        padding: 14px;
        border: 1px dashed #cbd8dc;
        border-radius: 12px;
        color: #71818a;
        font-size: 0.9rem;
        text-align: center;
      }

      .recordings-heading {
        margin: 24px 0 12px;
        font-size: 1rem;
      }

      .recordings-list {
        display: grid;
        gap: 8px;
      }

      .recording-item {
        width: 100%;
        padding: 8px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid #e1e9eb;
        color: #334b59;
        background: #fff;
      }

      .recording-item[aria-current="true"] {
        border-color: #57aa9f;
        background: #f0f8f6;
      }

      .recording-select {
        min-width: 0;
        min-height: 52px;
        padding: 4px 8px;
        flex: 1;
        display: grid;
        justify-items: start;
        gap: 4px;
        color: inherit;
        background: transparent;
        text-align: left;
      }

      .recording-title {
        overflow: hidden;
        max-width: 100%;
        font-size: 0.9rem;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .recording-details {
        color: #71818a;
        font-size: 0.78rem;
        font-weight: 500;
      }

      .recording-delete {
        min-height: 40px;
        padding: 0 12px;
        color: #a52e3b;
        background: #fcebed;
        font-size: 0.85rem;
      }

      .recordings-message {
        margin: 0;
        color: #71818a;
        font-size: 0.9rem;
      }

      .download-button {
        width: 100%;
        margin-top: 14px;
        color: #176f65;
        background: #e8f5f2;
      }

      .download-button:not(:disabled):hover {
        background: #d9efea;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Audio capture</p>
      <h1>Clinical Note Recorder</h1>
      <p class="intro">Speak and follow the live transcript while your audio is recorded.</p>

      <section class="recorder-card" aria-label="Audio recorder">
        <p class="timer" id="timer" aria-label="Recording duration">00:00</p>
        <p class="status" id="status" data-state="ready" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text">Ready to record</span>
        </p>

        <label class="language-control" for="language-select">
          Transcription language
          <select id="language-select">
            <option value="">Automatic</option>
            <option value="en">English</option>
            <option value="pt">Portuguese</option>
            <option value="hi">Hindi</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="ar">Arabic</option>
            <option value="zh">Chinese</option>
            <option value="ja">Japanese</option>
          </select>
        </label>

        <div class="live-monitor" id="live-monitor" hidden>
          <div class="live-monitor-header">
            <span>Microphone level</span>
            <span
              class="live-connection-state"
              id="live-connection-state"
              data-state="connecting"
              aria-live="polite"
            >Connecting</span>
          </div>
          <div
            class="microphone-meter"
            id="microphone-meter"
            role="meter"
            aria-label="Microphone input level"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div class="microphone-meter-fill" id="microphone-meter-fill"></div>
          </div>
        </div>

        <div class="controls">
          <button class="start-button" id="start-button" type="button">
            Start Recording
          </button>
          <button class="stop-button" id="stop-button" type="button" disabled>
            Stop
          </button>
          <button class="pause-button" id="pause-button" type="button" disabled>
            Pause
          </button>
        </div>
      </section>

      <section class="preview" aria-labelledby="preview-heading">
        <h2 class="preview-heading" id="preview-heading">Recording Preview</h2>
        <p class="audio-name" id="audio-name" hidden>Recording.webm</p>
        <audio id="audio-player" controls hidden></audio>
        <p class="preview-placeholder" id="preview-placeholder">
          Audio playback will appear here
        </p>
        <button class="download-button" id="download-button" type="button" disabled>
          Download Recording
        </button>
        <h2 class="recordings-heading">Transcript</h2>
        <textarea
          class="transcript-box"
          id="transcript-box"
          aria-label="Speech transcription"
          maxlength="50000"
          placeholder="Your spoken words will appear here as you speak."
        ></textarea>
        <div class="transcript-actions">
          <button class="transcript-action" id="copy-transcript-button" type="button" disabled>
            Copy
          </button>
          <button class="transcript-action" id="save-transcript-button" type="button" disabled>
            Save edits
          </button>
        </div>
        <h2 class="recordings-heading">Saved Recordings</h2>
        <div class="recordings-list" id="recordings-list" aria-live="polite">
          <p class="recordings-message">Loading recordings...</p>
        </div>
      </section>
    </main>

    <script>
      const startButton = document.querySelector("#start-button");
      const stopButton = document.querySelector("#stop-button");
      const pauseButton = document.querySelector("#pause-button");
      const languageSelect = document.querySelector("#language-select");
      const liveMonitor = document.querySelector("#live-monitor");
      const liveConnectionState = document.querySelector("#live-connection-state");
      const microphoneMeter = document.querySelector("#microphone-meter");
      const microphoneMeterFill = document.querySelector("#microphone-meter-fill");
      const downloadButton = document.querySelector("#download-button");
      const timerElement = document.querySelector("#timer");
      const statusElement = document.querySelector("#status");
      const statusText = document.querySelector("#status-text");
      const audioPlayer = document.querySelector("#audio-player");
      const audioName = document.querySelector("#audio-name");
      const previewPlaceholder = document.querySelector("#preview-placeholder");
      const transcriptBox = document.querySelector("#transcript-box");
      const copyTranscriptButton = document.querySelector("#copy-transcript-button");
      const saveTranscriptButton = document.querySelector("#save-transcript-button");
      const recordingsList = document.querySelector("#recordings-list");

      let mediaRecorder;
      let mediaStream;
      let recordingChunks = [];
      let recordingBlob;
      let audioUrl;
      let selectedDownloadUrl;
      let selectedRecordingId;
      let savedTranscript = "";
      let transcriptReviewed = false;
      let transcriptDirty = false;
      let userEdited = false;
      let startedAt;
      let pausedAt;
      let totalPausedMilliseconds = 0;
      let recordingDurationSeconds;
      let timerInterval;
      let liveSocket;
      let liveClosePromise;
      let liveFinishPromise;
      let liveFinishing = false;
      let liveTranscript = "";
      let liveLanguage;
      let recordingLanguage;
      let audioContext;
      let liveSource;
      let audioProcessor;
      let liveSampleRate;
      let liveChunkSeconds;
      let liveOverlapSeconds;
      let sampleRingBuffer;
      let liveWindowSamples;
      let liveWindowStrideSamples;
      let nextWindowStart = 0;
      let lastSentAudioEnd = 0;
      let pendingWindows = 0;
      let pendingWindowStarts = [];
      let lastAcknowledgedWindowStart;
      let reconnectTimer;
      let reconnectAttempt = 0;
      let audioFlushResolve;

      const LIVE_AUDIO_BUFFER_SECONDS = 120;

      class FloatSampleRingBuffer {
        constructor(capacity) {
          this.samples = new Float32Array(Math.max(1, Math.floor(capacity)));
          this.totalSamples = 0;
          this.oldestSample = 0;
        }

        write(samples) {
          if (samples.length === 0) return;
          const skipped = Math.max(0, samples.length - this.samples.length);
          const length = samples.length - skipped;
          const start = (this.totalSamples + skipped) % this.samples.length;
          const firstLength = Math.min(length, this.samples.length - start);
          this.samples.set(
            samples.subarray(skipped, skipped + firstLength),
            start,
          );
          const remaining = length - firstLength;
          if (remaining > 0) {
            this.samples.set(
              samples.subarray(skipped + firstLength),
              0,
            );
          }
          this.totalSamples += samples.length;
          this.oldestSample = Math.max(
            0,
            this.totalSamples - this.samples.length,
          );
        }
      }

      function setStatus(message, state) {
        statusText.textContent = message;
        statusElement.dataset.state = state;
      }

      function setLiveState(state) {
        const labels = {
          connecting: "Connecting",
          listening: "Listening",
          lagging: "Lagging",
          unavailable: "Unavailable",
          stopped: "Stopped",
        };
        liveConnectionState.dataset.state = state;
        liveConnectionState.textContent = labels[state];
      }

      function setMicrophoneLevel(rms) {
        const decibels = rms > 0 ? 20 * Math.log10(rms) : -60;
        const level = Math.max(0, Math.min(100, ((decibels + 60) / 60) * 100));
        microphoneMeter.setAttribute("aria-valuenow", String(Math.round(level)));
        microphoneMeterFill.style.width = `${level}%`;
      }

      function updateTimer() {
        const elapsedSeconds = Math.floor(getElapsedMilliseconds() / 1000);
        const minutes = Math.floor(elapsedSeconds / 60);
        const seconds = elapsedSeconds % 60;
        timerElement.textContent =
          `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }

      function getElapsedMilliseconds() {
        const endTime = pausedAt ?? Date.now();
        return Math.max(0, endTime - startedAt - totalPausedMilliseconds);
      }

      function formatDuration(seconds) {
        if (typeof seconds !== "number" || !Number.isFinite(seconds)) {
          return "Duration unknown";
        }
        const totalSeconds = Math.max(0, Math.round(seconds));
        const hours = Math.floor(totalSeconds / 3600);
        const minutes = Math.floor((totalSeconds % 3600) / 60);
        const remainingSeconds = totalSeconds % 60;
        const clock = [hours, minutes, remainingSeconds]
          .slice(hours > 0 ? 0 : 1)
          .map((value) => String(value).padStart(2, "0"))
          .join(":");
        return `Duration ${clock}`;
      }

      function formatLanguage(language) {
        const names = {
          ar: "Arabic",
          de: "German",
          en: "English",
          es: "Spanish",
          fr: "French",
          hi: "Hindi",
          it: "Italian",
          ja: "Japanese",
          pt: "Portuguese",
          zh: "Chinese",
        };
        return language
          ? `Language ${names[language] || language}`
          : "Language unknown";
      }

      function updateTranscriptActions() {
        copyTranscriptButton.disabled = !transcriptBox.value.trim();
        transcriptDirty = userEdited && transcriptBox.value !== savedTranscript;
        saveTranscriptButton.disabled =
          !selectedRecordingId || !transcriptDirty;
      }

      function stopTracks() {
        if (mediaStream) {
          mediaStream.getTracks().forEach((track) => track.stop());
          mediaStream = undefined;
        }
      }

      function clearPreviousRecording() {
        if (audioUrl) {
          URL.revokeObjectURL(audioUrl);
          audioUrl = undefined;
        }
        recordingBlob = undefined;
        selectedDownloadUrl = undefined;
        selectedRecordingId = undefined;
        savedTranscript = "";
        transcriptReviewed = false;
        transcriptDirty = false;
        userEdited = false;
        audioPlayer.removeAttribute("src");
        audioPlayer.load();
        audioPlayer.hidden = true;
        audioName.hidden = true;
        previewPlaceholder.hidden = false;
        transcriptBox.value = "";
        transcriptBox.placeholder =
          "Your spoken words will appear here as you speak.";
        liveTranscript = "";
        liveLanguage = undefined;
        downloadButton.disabled = true;
        updateTranscriptActions();
      }

      function sendRingWindow(start, length) {
        if (
          liveSocket?.readyState !== WebSocket.OPEN ||
          !sampleRingBuffer ||
          length <= 0 ||
          start < sampleRingBuffer.oldestSample ||
          start + length > sampleRingBuffer.totalSamples
        ) {
          return false;
        }

        const pcm = new Int16Array(length);
        const capacity = sampleRingBuffer.samples.length;
        let ringIndex = start % capacity;
        for (let index = 0; index < length; index += 1) {
          const sample = Math.max(
            -1,
            Math.min(1, sampleRingBuffer.samples[ringIndex]),
          );
          pcm[index] = sample < 0 ? sample * 32768 : sample * 32767;
          ringIndex += 1;
          if (ringIndex === capacity) ringIndex = 0;
        }
        liveSocket.send(pcm.buffer);
        pendingWindows += 1;
        pendingWindowStarts.push(start);
        lastSentAudioEnd = Math.max(lastSentAudioEnd, start + length);
        if (pendingWindows > 1) setLiveState("lagging");
        return true;
      }

      function sendPendingLiveWindows() {
        if (
          !sampleRingBuffer ||
          !liveWindowSamples ||
          !liveWindowStrideSamples ||
          liveSocket?.readyState !== WebSocket.OPEN
        ) {
          return;
        }

        advancePastExpiredWindows();
        while (
          nextWindowStart + liveWindowSamples <=
          sampleRingBuffer.totalSamples
        ) {
          if (!sendRingWindow(nextWindowStart, liveWindowSamples)) return;
          nextWindowStart += liveWindowStrideSamples;
        }
      }

      function handleAudioWorkletMessage(event) {
        const message = event.data;
        if (message.type === "samples" && sampleRingBuffer) {
          sampleRingBuffer.write(
            new Float32Array(message.buffer, 0, message.length),
          );
          audioProcessor.port.postMessage(
            { type: "recycle", buffer: message.buffer },
            [message.buffer],
          );
          sendPendingLiveWindows();
        } else if (message.type === "level") {
          setMicrophoneLevel(message.rms);
        } else if (message.type === "flushed" && audioFlushResolve) {
          const resolve = audioFlushResolve;
          audioFlushResolve = undefined;
          resolve();
        }
      }

      function flushAudioCapture() {
        if (!audioProcessor) return Promise.resolve();
        return new Promise((resolve) => {
          let timeoutId;
          const finish = () => {
            clearTimeout(timeoutId);
            if (audioFlushResolve === finish) audioFlushResolve = undefined;
            resolve();
          };
          audioFlushResolve = finish;
          timeoutId = setTimeout(finish, 250);
          audioProcessor.port.postMessage({ type: "flush" });
        });
      }

      function disconnectLiveAudioCapture() {
        if (audioProcessor) {
          audioProcessor.port.onmessage = null;
          audioProcessor.port.close();
          audioProcessor.disconnect();
          audioProcessor = undefined;
        }
        if (liveSource) {
          liveSource.disconnect();
          liveSource = undefined;
        }
        if (audioContext) {
          audioContext.close();
          audioContext = undefined;
        }
      }

      async function startLiveTranscription() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass || !window.AudioWorkletNode) {
          throw new Error("AudioWorklet capture is unavailable.");
        }

        audioContext = new AudioContextClass();
        await audioContext.resume();
        if (liveFinishing) return;
        liveSampleRate = audioContext.sampleRate;
        sampleRingBuffer = new FloatSampleRingBuffer(
          liveSampleRate * LIVE_AUDIO_BUFFER_SECONDS,
        );
        if (!audioContext.audioWorklet) {
          throw new Error("AudioWorklet capture is unavailable.");
        }
        await audioContext.audioWorklet.addModule(
          "/static/audio-capture-worklet.js",
        );
        if (liveFinishing) return;

        liveSource = audioContext.createMediaStreamSource(mediaStream);
        audioProcessor = new AudioWorkletNode(
          audioContext,
          "audio-capture-processor",
          { outputChannelCount: [1] },
        );
        audioProcessor.port.onmessage = handleAudioWorkletMessage;
        liveSource.connect(audioProcessor);
        audioProcessor.connect(audioContext.destination);

        try {
          await connectLiveSocket();
        } catch (error) {
          if (
            mediaRecorder?.state === "recording" ||
            mediaRecorder?.state === "paused"
          ) {
            scheduleLiveReconnect(error);
            return;
          }
          throw error;
        }
      }

      function advancePastExpiredWindows() {
        if (
          !sampleRingBuffer ||
          !liveWindowStrideSamples ||
          nextWindowStart >= sampleRingBuffer.oldestSample
        ) {
          return;
        }
        const missedSamples = sampleRingBuffer.oldestSample - nextWindowStart;
        const missedWindows = Math.ceil(missedSamples / liveWindowStrideSamples);
        nextWindowStart += missedWindows * liveWindowStrideSamples;
        setLiveState("lagging");
      }

      function scheduleLiveReconnect(error) {
        if (
          liveFinishing ||
          (mediaRecorder?.state !== "recording" &&
            mediaRecorder?.state !== "paused")
        ) {
          return;
        }
        clearTimeout(reconnectTimer);
        pendingWindows = 0;
        pendingWindowStarts = [];
        if (liveWindowStrideSamples) {
          nextWindowStart =
            lastAcknowledgedWindowStart === undefined
              ? 0
              : lastAcknowledgedWindowStart + liveWindowStrideSamples;
        }
        setLiveState("connecting");
        setStatus(
          error
            ? `Live transcription disconnected; reconnecting: ${error.message}`
            : "Live transcription disconnected; reconnecting...",
          "recording",
        );
        const delay = Math.min(500 * 2 ** Math.min(reconnectAttempt, 3), 4000);
        reconnectAttempt += 1;
        reconnectTimer = setTimeout(() => {
          reconnectTimer = undefined;
          void connectLiveSocket().catch((reconnectError) => {
            if (
              !liveFinishing &&
              (mediaRecorder?.state === "recording" ||
                mediaRecorder?.state === "paused")
            ) {
              scheduleLiveReconnect(reconnectError);
            }
          });
        }, delay);
      }

      async function connectLiveSocket() {
        if (liveFinishing) return;
        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const parameters = new URLSearchParams({
          sample_rate: String(liveSampleRate),
        });
        if (recordingLanguage) parameters.set("language", recordingLanguage);
        const socketUrl =
          `${protocol}//${window.location.host}/api/recordings/live?${parameters}`;
        const socket = new WebSocket(socketUrl);
        liveSocket = socket;
        socket.binaryType = "arraybuffer";
        liveClosePromise = new Promise((resolve) => {
          socket.addEventListener("close", resolve, { once: true });
        });

        await new Promise((resolve, reject) => {
          let ready = false;
          const onMessage = (event) => {
            const message = JSON.parse(event.data);
            if (!ready && message.type === "status" && message.status === "ready") {
              ready = true;
              liveChunkSeconds = message.window_seconds;
              liveOverlapSeconds = message.overlap_seconds;
              liveWindowSamples = Math.floor(
                liveSampleRate * liveChunkSeconds,
              );
              liveWindowStrideSamples = Math.floor(
                liveSampleRate * (liveChunkSeconds - liveOverlapSeconds),
              );
              advancePastExpiredWindows();
              try {
                socket.send(
                  JSON.stringify({
                    type: "resume",
                    transcript: liveTranscript.split(/\s+/).slice(-48).join(" "),
                    resume_at_seconds: nextWindowStart / liveSampleRate,
                    language: recordingLanguage || null,
                  }),
                );
              } catch (error) {
                reject(error);
                return;
              }
              socket.removeEventListener("message", onMessage);
              socket.addEventListener("message", (transcriptEvent) => {
                if (liveSocket === socket) {
                  handleLiveTranscriptMessage(transcriptEvent);
                }
              });
              if (liveFinishing) {
                socket.close();
                resolve();
                return;
              }
              setLiveState("listening");
              sendPendingLiveWindows();
              resolve();
            } else if (!ready && message.type === "error") {
              socket.removeEventListener("message", onMessage);
              reject(new Error(message.message || "Live transcription failed."));
            }
          };
          socket.addEventListener("message", onMessage);
          socket.addEventListener(
            "error",
            () => reject(new Error("Could not connect to live transcription.")),
            { once: true },
          );
          socket.addEventListener(
            "close",
            (event) => {
              if (!ready) {
                reject(new Error(`Live transcription closed (${event.code}).`));
              } else if (liveSocket === socket && !liveFinishing) {
                scheduleLiveReconnect(
                  new Error(`Connection closed (${event.code}).`),
                );
              }
            },
            { once: true },
          );
          socket.addEventListener("error", () => {
            if (socket.readyState === WebSocket.OPEN) socket.close();
          });
        });
      }

      function handleLiveTranscriptMessage(event) {
        const message = JSON.parse(event.data);
        if (message.type !== "transcript") return;
        const acknowledgedStart = pendingWindowStarts.shift();
        if (acknowledgedStart !== undefined) {
          lastAcknowledgedWindowStart = acknowledgedStart;
        }
        pendingWindows = pendingWindowStarts.length;
        reconnectAttempt = 0;
        if (message.segment) {
          liveTranscript = [liveTranscript, message.segment.trim()]
            .filter(Boolean)
            .join(" ");
        }
        liveLanguage = message.language || liveLanguage;
        if (!transcriptDirty) {
          userEdited = false;
          transcriptBox.value = liveTranscript;
          updateTranscriptActions();
        }
        if (!liveFinishing) {
          setLiveState(pendingWindows > 1 ? "lagging" : "listening");
        }
        if (mediaRecorder?.state === "recording") {
          setStatus("Live transcription active", "recording");
        }
      }

      async function finishLiveTranscription() {
        liveFinishing = true;
        clearTimeout(reconnectTimer);
        reconnectTimer = undefined;
        await flushAudioCapture();
        disconnectLiveAudioCapture();
        const liveReady =
          liveWindowSamples !== undefined &&
          liveWindowStrideSamples !== undefined &&
          liveSocket?.readyState === WebSocket.OPEN;
        if (liveReady) {
          sendPendingLiveWindows();
        }
        if (
          liveReady &&
          sampleRingBuffer &&
          sampleRingBuffer.totalSamples > lastSentAudioEnd
        ) {
          const remainingSamples =
            sampleRingBuffer.totalSamples - nextWindowStart;
          if (remainingSamples > 0) {
            sendRingWindow(nextWindowStart, remainingSamples);
          }
        }
        sampleRingBuffer = undefined;
        setMicrophoneLevel(0);
        setLiveState("stopped");

        if (!liveReady) {
          if (
            liveSocket?.readyState === WebSocket.CONNECTING ||
            liveSocket?.readyState === WebSocket.OPEN
          ) {
            liveSocket.close();
          }
          return liveClosePromise || Promise.resolve();
        }
        liveSocket.send(JSON.stringify({ type: "stop" }));
        return liveClosePromise || Promise.resolve();
      }

      function handleLiveTranscriptionFailure(error) {
        clearTimeout(reconnectTimer);
        reconnectTimer = undefined;
        disconnectLiveAudioCapture();
        sampleRingBuffer = undefined;
        pendingWindows = 0;
        pendingWindowStarts = [];
        setMicrophoneLevel(0);
        setLiveState("unavailable");
        if (
          liveSocket?.readyState === WebSocket.CONNECTING ||
          liveSocket?.readyState === WebSocket.OPEN
        ) {
          liveSocket.close();
        }
        liveSocket = undefined;
        if (
          !liveFinishing &&
          (mediaRecorder?.state === "recording" ||
            mediaRecorder?.state === "paused")
        ) {
          setStatus(
            `Live transcription unavailable: ${error.message} Recording will still be saved.`,
            "recording",
          );
        }
      }

      function getFileExtension(mimeType) {
        if (mimeType.includes("ogg")) return "ogg";
        if (mimeType.includes("mp4")) return "m4a";
        return "webm";
      }

      function formatTimestamp(value) {
        return new Date(value).toLocaleString();
      }

      function setPreview(audioSource, title, downloadUrl) {
        audioPlayer.src = audioSource;
        audioPlayer.hidden = false;
        audioName.textContent = title;
        audioName.hidden = false;
        previewPlaceholder.hidden = true;
        selectedDownloadUrl = downloadUrl;
        downloadButton.disabled = false;
      }

      function renderRecordings(recordings) {
        recordingsList.replaceChildren();

        if (recordings.length === 0) {
          const message = document.createElement("p");
          message.className = "recordings-message";
          message.textContent = "No saved recordings yet.";
          recordingsList.append(message);
          return;
        }

        for (const recording of recordings) {
          const item = document.createElement("div");
          item.className = "recording-item";
          item.setAttribute("aria-current", String(recording.id === selectedRecordingId));

          const selectButton = document.createElement("button");
          selectButton.className = "recording-select";
          selectButton.type = "button";
          const title = document.createElement("span");
          title.className = "recording-title";
          title.textContent = formatTimestamp(recording.created_at);
          const details = document.createElement("span");
          details.className = "recording-details";
          details.textContent =
            `${formatDuration(recording.duration_seconds)} · ${formatLanguage(recording.language)}`;
          selectButton.append(title, details);
          selectButton.addEventListener("click", () => {
            if (selectedRecordingId === recording.id && transcriptDirty) return;
            if (
              transcriptDirty &&
              selectedRecordingId !== recording.id &&
              !window.confirm("Discard unsaved transcript edits?")
            ) {
              return;
            }
            if (audioUrl) {
              URL.revokeObjectURL(audioUrl);
              audioUrl = undefined;
            }
            recordingBlob = undefined;
            selectedRecordingId = recording.id;
            setPreview(
              recording.audio_url,
              formatTimestamp(recording.created_at),
              recording.download_url,
            );
            userEdited = false;
            transcriptBox.value = recording.transcript || "";
            transcriptBox.placeholder =
              "Your spoken words will appear here as you speak.";
            savedTranscript = transcriptBox.value;
            transcriptReviewed = Boolean(recording.transcript_reviewed);
            updateTranscriptActions();
            setStatus("Playing a saved recording", "ready");
            renderRecordings(recordings);
          });
          const deleteButton = document.createElement("button");
          deleteButton.className = "recording-delete";
          deleteButton.type = "button";
          deleteButton.textContent = "Delete";
          deleteButton.setAttribute(
            "aria-label",
            `Delete recording from ${formatTimestamp(recording.created_at)}`,
          );
          deleteButton.addEventListener("click", () => {
            void deleteRecording(recording).catch((error) => {
              setStatus(`Could not delete recording: ${error.message}`, "error");
            });
          });
          item.append(selectButton, deleteButton);
          recordingsList.append(item);
        }
      }

      async function deleteRecording(recording) {
        if (
          !window.confirm(
            `Delete this recording (${formatTimestamp(recording.created_at)}) and its transcript?`,
          )
        ) {
          return;
        }
        const response = await fetch(`/api/recordings/${recording.id}`, {
          method: "DELETE",
        });
        if (!response.ok) throw new Error(await responseError(response));
        if (selectedRecordingId === recording.id) {
          audioPlayer.pause();
          clearPreviousRecording();
          audioName.textContent = "";
          setStatus("Recording deleted", "ready");
        }
        await loadRecordings();
      }

      async function loadRecordings() {
        const response = await fetch("/api/recordings");
        if (!response.ok) throw new Error("Could not load saved recordings.");
        const recordings = await response.json();
        renderRecordings(recordings);
        return recordings;
      }

      async function responseError(response) {
        const responseBody = await response.text();
        try {
          const problem = JSON.parse(responseBody);
          if (problem.detail) {
            if (Array.isArray(problem.detail)) {
              return problem.detail
                .map((detail) => detail.msg || String(detail))
                .join("; ");
            }
            if (typeof problem.detail === "string") return problem.detail;
            return JSON.stringify(problem.detail);
          }
        } catch {
          return `Server returned HTTP ${response.status}. Check the Uvicorn terminal for details.`;
        }
        return `Server returned HTTP ${response.status}. Check the Uvicorn terminal for details.`;
      }

      async function transcribeRecording(recordingId, language) {
        const isSelected = () => selectedRecordingId === recordingId;
        if (isSelected() && !transcriptBox.value && !transcriptDirty) {
          transcriptBox.placeholder = "Loading speech model and transcribing...";
        }
        if (isSelected()) setStatus("Finalizing transcript...", "recording");

        const languageParameter = language
          ? `?language=${encodeURIComponent(language)}`
          : "";
        const response = await fetch(
          `/api/recordings/${recordingId}/transcribe${languageParameter}`,
          {
            method: "POST",
          },
        );
        if (!response.ok) throw new Error(await responseError(response));

        const result = await response.json();
        if (isSelected() && result.transcript_reviewed) {
          transcriptReviewed = true;
          if (!transcriptDirty) {
            userEdited = false;
            transcriptBox.value = result.text || "";
            savedTranscript = transcriptBox.value;
            transcriptBox.placeholder =
              "Your spoken words will appear here as you speak.";
            updateTranscriptActions();
          }
        } else if (isSelected() && !transcriptDirty && !transcriptReviewed) {
          userEdited = false;
          transcriptBox.value = result.text || "";
          savedTranscript = transcriptBox.value;
          transcriptBox.placeholder = "Your spoken words will appear here as you speak.";
          updateTranscriptActions();
        }
        try {
          await loadRecordings();
        } catch (error) {
          if (isSelected()) {
            setStatus(
              `Transcription ready, but the saved list could not refresh: ${error.message}`,
              "error",
            );
          }
          return;
        }
        if (isSelected()) {
          setStatus(
            result.text ? "Transcription complete" : "No speech detected",
            "ready",
          );
        }
      }

      function waitForLiveDrain() {
        if (!liveFinishPromise) return Promise.resolve();
        let timeoutId;
        const outcome = Promise.race([
          liveFinishPromise.then(
            () => ({ status: "drained" }),
            (error) => ({ status: "failed", error }),
          ),
          new Promise((resolve) => {
            timeoutId = setTimeout(
              () => resolve({ status: "timeout" }),
              4000,
            );
          }),
        ]);
        return outcome.then((result) => {
          clearTimeout(timeoutId);
          if (result.status === "timeout") {
            if (
              liveSocket?.readyState === WebSocket.CONNECTING ||
              liveSocket?.readyState === WebSocket.OPEN
            ) {
              liveSocket.close();
            }
            setStatus(
              "Finalizing... Live transcript may be incomplete.",
              "recording",
            );
          } else if (result.status === "failed") {
            setStatus(
              `Finalizing... Live transcription drain failed: ${result.error.message}`,
              "recording",
            );
          }
        });
      }

      async function saveRecording(
        blob,
        durationSeconds,
        transcript,
        language,
        transcriptionLanguage,
      ) {
        const transcriptAtSave = transcriptBox.value;
        const extension = getFileExtension(blob.type);
        const formData = new FormData();
        formData.append(
          "file",
          new File([blob], `recording.${extension}`, {
            type: blob.type || "audio/webm",
          }),
        );
        formData.append("duration_seconds", String(durationSeconds));
        if (transcript) formData.append("transcript", transcript);
        if (language) formData.append("language", language);

        const response = await fetch("/api/recordings", {
          method: "POST",
          body: formData,
        });
        if (!response.ok) {
          throw new Error(await responseError(response));
        }

        const recording = await response.json();
        const editedDuringSave =
          userEdited && transcriptBox.value !== transcriptAtSave;
        selectedRecordingId = recording.id;
        savedTranscript = transcript || "";
        userEdited = editedDuringSave;
        transcriptReviewed = false;
        if (audioUrl) URL.revokeObjectURL(audioUrl);
        audioUrl = undefined;
        setPreview(
          recording.audio_url,
          formatTimestamp(recording.created_at),
          recording.download_url,
        );
        try {
          await loadRecordings();
        } catch (error) {
          setStatus(
            `Recording saved, but the saved list could not refresh: ${error.message}`,
            "error",
          );
        }
        if (!userEdited) transcriptBox.value = transcript || "";
        updateTranscriptActions();
        setStatus("Recording saved. Finalizing transcript in the background...", "recording");
        void transcribeRecording(recording.id, transcriptionLanguage).catch((error) => {
          if (selectedRecordingId !== recording.id) return;
          if (transcript) {
            if (!transcriptDirty) {
              userEdited = false;
              transcriptBox.value = transcript;
              updateTranscriptActions();
            }
            setStatus(
              `Recording and live transcript saved, but final transcription failed: ${error.message}`,
              "error",
            );
          } else {
            if (!transcriptDirty) {
              userEdited = false;
              transcriptBox.value = "";
              updateTranscriptActions();
            }
            transcriptBox.placeholder =
              "Transcription failed. The audio recording is saved.";
            setStatus(
              `Recording saved, but transcription failed: ${error.message}`,
              "error",
            );
          }
        });
      }

      startButton.addEventListener("click", async () => {
        if (
          transcriptDirty &&
          !window.confirm("Discard unsaved transcript edits and start a new recording?")
        ) {
          return;
        }
        if (!navigator.mediaDevices?.getUserMedia) {
          setStatus("Microphone recording requires a supported browser on localhost or HTTPS.", "error");
          return;
        }
        if (typeof MediaRecorder === "undefined") {
          setStatus("Audio recording is not supported by this browser.", "error");
          return;
        }

        startButton.disabled = true;
        languageSelect.disabled = true;
        setStatus("Requesting microphone access...", "ready");
        const selectedLanguage = languageSelect.value || undefined;

        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const preferredType = [
            "audio/webm;codecs=opus",
            "audio/webm",
            "audio/ogg;codecs=opus",
            "audio/mp4",
          ].find((type) => MediaRecorder.isTypeSupported(type));

          mediaRecorder = preferredType
            ? new MediaRecorder(mediaStream, { mimeType: preferredType })
            : new MediaRecorder(mediaStream);

          clearPreviousRecording();
          recordingChunks = [];
          recordingDurationSeconds = undefined;
          pausedAt = undefined;
          totalPausedMilliseconds = 0;
          liveFinishPromise = undefined;
          liveFinishing = false;
          reconnectAttempt = 0;
          clearTimeout(reconnectTimer);
          reconnectTimer = undefined;
          liveSocket = undefined;
          liveClosePromise = undefined;
          liveChunkSeconds = undefined;
          liveOverlapSeconds = undefined;
          sampleRingBuffer = undefined;
          liveWindowSamples = undefined;
          liveWindowStrideSamples = undefined;
          nextWindowStart = 0;
          lastSentAudioEnd = 0;
          pendingWindows = 0;
          pendingWindowStarts = [];
          lastAcknowledgedWindowStart = undefined;
          audioFlushResolve = undefined;
          recordingLanguage = selectedLanguage;
          liveMonitor.hidden = false;
          setLiveState("connecting");
          setMicrophoneLevel(0);
          mediaRecorder.addEventListener("dataavailable", (event) => {
            if (event.data.size > 0) recordingChunks.push(event.data);
          });
          mediaRecorder.addEventListener("error", () => {
            clearInterval(timerInterval);
            void finishLiveTranscription().catch(handleLiveTranscriptionFailure);
            stopTracks();
            stopButton.disabled = true;
            pauseButton.disabled = true;
            startButton.disabled = false;
            languageSelect.disabled = false;
            liveMonitor.hidden = true;
            setStatus("Recording failed. Please try again.", "error");
          });
          mediaRecorder.addEventListener("stop", async () => {
            clearInterval(timerInterval);
            stopTracks();
            stopButton.disabled = true;
            pauseButton.disabled = true;
            await waitForLiveDrain();
            liveMonitor.hidden = true;

            recordingBlob = new Blob(recordingChunks, {
              type: mediaRecorder.mimeType || "audio/webm",
            });
            if (recordingBlob.size === 0) {
              setStatus("No audio was captured. Please try again.", "error");
              startButton.disabled = false;
              languageSelect.disabled = false;
              liveMonitor.hidden = true;
              return;
            }

            const extension = getFileExtension(recordingBlob.type);
            audioUrl = URL.createObjectURL(recordingBlob);
            selectedRecordingId = undefined;
            setPreview(audioUrl, `Recording.${extension}`, audioUrl);
            startButton.disabled = true;
            setStatus("Saving recording...", "ready");
            try {
              await saveRecording(
                recordingBlob,
                recordingDurationSeconds ??
                  Math.floor(getElapsedMilliseconds() / 1000),
                transcriptDirty ? transcriptBox.value : liveTranscript,
                liveLanguage,
                recordingLanguage,
              );
            } catch (error) {
              setStatus(
                `Save failed: ${error.message} The audio is only available in this browser session.`,
                "error",
              );
            } finally {
              startButton.disabled = false;
              languageSelect.disabled = false;
            }
          });

          mediaRecorder.start(1500);
          startedAt = Date.now();
          pausedAt = undefined;
          totalPausedMilliseconds = 0;
          timerElement.textContent = "00:00";
          timerInterval = setInterval(updateTimer, 250);
          stopButton.disabled = false;
          pauseButton.disabled = false;
          pauseButton.textContent = "Pause";
          setStatus("Recording...", "recording");
          void startLiveTranscription().catch(handleLiveTranscriptionFailure);
        } catch (error) {
          stopTracks();
          startButton.disabled = false;
          languageSelect.disabled = false;
          const message =
            error.name === "NotAllowedError"
              ? "Microphone access was denied. Allow microphone access and try again."
              : error.name === "NotFoundError"
                ? "No microphone was found."
                : "Could not start recording. Check your microphone and try again.";
          setStatus(message, "error");
        }
      });

      stopButton.addEventListener("click", () => {
        if (
          mediaRecorder?.state === "recording" ||
          mediaRecorder?.state === "paused"
        ) {
          recordingDurationSeconds = Math.floor(
            getElapsedMilliseconds() / 1000,
          );
          stopButton.disabled = true;
          pauseButton.disabled = true;
          setStatus("Finalizing...", "recording");
          liveFinishPromise = finishLiveTranscription();
          mediaRecorder.stop();
          updateTimer();
        }
      });

      pauseButton.addEventListener("click", () => {
        if (mediaRecorder?.state === "recording") {
          try {
            mediaRecorder.pause();
          } catch (error) {
            setStatus(`Could not pause recording: ${error.message}`, "error");
            return;
          }
          pausedAt = Date.now();
          clearInterval(timerInterval);
          pauseButton.textContent = "Resume";
          setStatus("Recording paused", "ready");
          void audioContext?.suspend().catch((error) => {
            setStatus(
              `Recording paused; live audio capture could not pause: ${error.message}`,
              "error",
            );
          });
        } else if (mediaRecorder?.state === "paused") {
          try {
            mediaRecorder.resume();
          } catch (error) {
            setStatus(`Could not resume recording: ${error.message}`, "error");
            return;
          }
          totalPausedMilliseconds += Date.now() - pausedAt;
          pausedAt = undefined;
          timerInterval = setInterval(updateTimer, 250);
          pauseButton.textContent = "Pause";
          setStatus("Recording...", "recording");
          void audioContext?.resume().catch(handleLiveTranscriptionFailure);
        }
      });

      transcriptBox.addEventListener("input", () => {
        userEdited = true;
        updateTranscriptActions();
      });

      copyTranscriptButton.addEventListener("click", async () => {
        try {
          await navigator.clipboard.writeText(transcriptBox.value);
          setStatus("Transcript copied", "ready");
        } catch (error) {
          setStatus(`Could not copy transcript: ${error.message}`, "error");
        }
      });

      saveTranscriptButton.addEventListener("click", async () => {
        if (!selectedRecordingId || !transcriptDirty) return;
        const transcriptToSave = transcriptBox.value;
        saveTranscriptButton.disabled = true;
        transcriptReviewed = true;
        try {
          const response = await fetch(
            `/api/recordings/${selectedRecordingId}/transcript`,
            {
              method: "PUT",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ transcript: transcriptToSave }),
            },
          );
          if (!response.ok) throw new Error(await responseError(response));
          savedTranscript = transcriptToSave;
          userEdited = transcriptBox.value !== transcriptToSave;
          updateTranscriptActions();
          await loadRecordings();
          setStatus("Reviewed transcript edits saved", "ready");
        } catch (error) {
          updateTranscriptActions();
          setStatus(`Could not save transcript edits: ${error.message}`, "error");
        }
      });

      downloadButton.addEventListener("click", () => {
        if (!selectedDownloadUrl) return;
        const link = document.createElement("a");
        link.href = selectedDownloadUrl;
        if (recordingBlob && selectedDownloadUrl === audioUrl) {
          link.download = `recording.${getFileExtension(recordingBlob.type)}`;
        }
        document.body.append(link);
        link.click();
        link.remove();
      });

      loadRecordings().catch(() => {
        const message = document.createElement("p");
        message.className = "recordings-message";
        message.textContent = "Could not load saved recordings. Refresh to try again.";
        recordingsList.replaceChildren(message);
      });

      window.addEventListener("beforeunload", () => {
        clearInterval(timerInterval);
        clearTimeout(reconnectTimer);
        stopTracks();
        if (audioUrl) URL.revokeObjectURL(audioUrl);
      });
    </script>
  </body>
</html>
