<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Record and preview audio for a clinical note."
    />
    <title>Clinical Note Recorder</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        color: #172b3a;
        background: #f3f7f8;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px 16px;
        background:
          radial-gradient(ellipse at 10% 0%, #e1f3f0 0, transparent 38%),
          #f3f7f8;
      }

      main {
        width: min(100%, 560px);
      }

      .eyebrow {
        margin: 0 0 8px;
        color: #167c72;
        font-size: 0.75rem;
        font-weight: 750;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.75rem, 5vw, 2.25rem);
        letter-spacing: -0.045em;
      }

      .intro {
        margin: 9px 0 24px;
        color: #60717e;
        line-height: 1.55;
      }

      .recorder-card {
        padding: clamp(22px, 6vw, 34px);
        border: 1px solid #e1e9eb;
        border-radius: 22px;
        background: #fff;
        box-shadow: 0 18px 50px rgb(34 67 79 / 9%);
      }

      .timer {
        margin: 0;
        color: #102b38;
        font-size: clamp(3.5rem, 15vw, 5rem);
        font-variant-numeric: tabular-nums;
        font-weight: 680;
        letter-spacing: -0.075em;
        line-height: 1.1;
        text-align: center;
      }

      .status {
        min-height: 24px;
        margin: 12px 0 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        color: #60717e;
        font-size: 0.95rem;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #93a2a9;
      }

      .status[data-state="recording"] {
        color: #b42332;
      }

      .status[data-state="recording"] .status-dot {
        background: #d83a4b;
        box-shadow: 0 0 0 4px #fce8ea;
        animation: pulse 1.5s ease-in-out infinite;
      }

      .status[data-state="ready"] {
        color: #167c55;
      }

      .status[data-state="ready"] .status-dot {
        background: #20a36b;
      }

      .status[data-state="error"] {
        color: #b42332;
      }

      .status[data-state="error"] .status-dot {
        background: #d83a4b;
      }

      @keyframes pulse {
        50% {
          box-shadow: 0 0 0 7px rgb(216 58 75 / 10%);
        }
      }

      .controls {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 12px;
      }

      .language-control {
        display: grid;
        gap: 7px;
        width: min(100%, 320px);
        margin: 0 auto 18px;
        color: #425765;
        font-size: 0.9rem;
        font-weight: 650;
      }

      .language-control select {
        min-height: 44px;
        padding: 8px 12px;
        border: 1px solid #cbd9dc;
        border-radius: 10px;
        color: #172b3a;
        background: #fff;
        font: inherit;
      }

      .language-control select:focus-visible {
        outline: 3px solid #72c9bf;
        outline-offset: 3px;
      }

      .language-control select:disabled {
        cursor: not-allowed;
        opacity: 0.6;
      }

      button {
        min-height: 48px;
        padding: 0 20px;
        border: 0;
        border-radius: 12px;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
        transition:
          transform 120ms ease,
          background-color 120ms ease,
          box-shadow 120ms ease;
      }

      button:not(:disabled):active {
        transform: translateY(1px);
      }

      button:focus-visible {
        outline: 3px solid #72c9bf;
        outline-offset: 3px;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.48;
      }

      .start-button {
        color: #fff;
        background: #147d72;
        box-shadow: 0 5px 12px rgb(20 125 114 / 18%);
      }

      .start-button:not(:disabled):hover {
        background: #106b62;
      }

      .stop-button {
        color: #fff;
        background: #c33b49;
      }

      .stop-button:not(:disabled):hover {
        background: #aa2e3b;
      }

      .preview {
        margin-top: 20px;
        padding: 22px;
        border: 1px solid #e1e9eb;
        border-radius: 18px;
        background: #fff;
      }

      .preview-heading {
        margin: 0 0 14px;
        font-size: 1rem;
      }

      .audio-name {
        margin: 0 0 12px;
        color: #334b59;
        font-size: 0.9rem;
        font-weight: 650;
      }

      audio {
        width: 100%;
        height: 44px;
      }

      .transcript-box {
        width: 100%;
        min-height: 132px;
        padding: 12px 14px;
        border: 1px solid #d5e0e3;
        border-radius: 12px;
        color: #334b59;
        background: #fbfdfd;
        font: inherit;
        line-height: 1.55;
        resize: vertical;
      }

      .transcript-box:focus-visible {
        outline: 3px solid #72c9bf;
        outline-offset: 2px;
      }

      .preview-placeholder {
        margin: 0;
        padding: 14px;
        border: 1px dashed #cbd8dc;
        border-radius: 12px;
        color: #71818a;
        font-size: 0.9rem;
        text-align: center;
      }

      .recordings-heading {
        margin: 24px 0 12px;
        font-size: 1rem;
      }

      .recordings-list {
        display: grid;
        gap: 8px;
      }

      .recording-item {
        width: 100%;
        min-height: 48px;
        padding: 10px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        border: 1px solid #e1e9eb;
        color: #334b59;
        background: #fff;
        text-align: left;
      }

      .recording-item[aria-current="true"] {
        border-color: #57aa9f;
        background: #f0f8f6;
      }

      .recordings-message {
        margin: 0;
        color: #71818a;
        font-size: 0.9rem;
      }

      .download-button {
        width: 100%;
        margin-top: 14px;
        color: #176f65;
        background: #e8f5f2;
      }

      .download-button:not(:disabled):hover {
        background: #d9efea;
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Audio capture</p>
      <h1>Clinical Note Recorder</h1>
      <p class="intro">Speak and follow the live transcript while your audio is recorded.</p>

      <section class="recorder-card" aria-label="Audio recorder">
        <p class="timer" id="timer" aria-label="Recording duration">00:00</p>
        <p class="status" id="status" data-state="ready" role="status" aria-live="polite">
          <span class="status-dot" aria-hidden="true"></span>
          <span id="status-text">Ready to record</span>
        </p>

        <label class="language-control" for="language-select">
          Transcription language
          <select id="language-select">
            <option value="">Automatic</option>
            <option value="en">English</option>
            <option value="pt">Portuguese</option>
            <option value="hi">Hindi</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="de">German</option>
            <option value="it">Italian</option>
            <option value="ar">Arabic</option>
            <option value="zh">Chinese</option>
            <option value="ja">Japanese</option>
          </select>
        </label>

        <div class="controls">
          <button class="start-button" id="start-button" type="button">
            Start Recording
          </button>
          <button class="stop-button" id="stop-button" type="button" disabled>
            Stop
          </button>
        </div>
      </section>

      <section class="preview" aria-labelledby="preview-heading">
        <h2 class="preview-heading" id="preview-heading">Recording Preview</h2>
        <p class="audio-name" id="audio-name" hidden>Recording.webm</p>
        <audio id="audio-player" controls hidden></audio>
        <p class="preview-placeholder" id="preview-placeholder">
          Audio playback will appear here
        </p>
        <button class="download-button" id="download-button" type="button" disabled>
          Download Recording
        </button>
        <h2 class="recordings-heading">Transcript</h2>
        <textarea
          class="transcript-box"
          id="transcript-box"
          aria-label="Speech transcription"
          placeholder="Your spoken words will appear here as you speak."
          readonly
        ></textarea>
        <h2 class="recordings-heading">Saved Recordings</h2>
        <div class="recordings-list" id="recordings-list" aria-live="polite">
          <p class="recordings-message">Loading recordings...</p>
        </div>
      </section>
    </main>

    <script>
      const startButton = document.querySelector("#start-button");
      const stopButton = document.querySelector("#stop-button");
      const languageSelect = document.querySelector("#language-select");
      const downloadButton = document.querySelector("#download-button");
      const timerElement = document.querySelector("#timer");
      const statusElement = document.querySelector("#status");
      const statusText = document.querySelector("#status-text");
      const audioPlayer = document.querySelector("#audio-player");
      const audioName = document.querySelector("#audio-name");
      const previewPlaceholder = document.querySelector("#preview-placeholder");
      const transcriptBox = document.querySelector("#transcript-box");
      const recordingsList = document.querySelector("#recordings-list");

      let mediaRecorder;
      let mediaStream;
      let recordingChunks = [];
      let recordingBlob;
      let audioUrl;
      let selectedDownloadUrl;
      let selectedRecordingId;
      let startedAt;
      let recordingDurationSeconds;
      let timerInterval;
      let liveSocket;
      let liveClosePromise;
      let liveFinishPromise;
      let liveFinishing = false;
      let liveTranscript = "";
      let liveLanguage;
      let recordingLanguage;
      let audioContext;
      let liveSource;
      let audioProcessor;
      let pendingSamples = [];
      let liveSampleRate;
      let liveChunkSeconds;
      let liveOverlapSeconds;

      function setStatus(message, state) {
        statusText.textContent = message;
        statusElement.dataset.state = state;
      }

      function updateTimer() {
        const elapsedSeconds = Math.floor((Date.now() - startedAt) / 1000);
        const minutes = Math.floor(elapsedSeconds / 60);
        const seconds = elapsedSeconds % 60;
        timerElement.textContent =
          `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;
      }

      function stopTracks() {
        if (mediaStream) {
          mediaStream.getTracks().forEach((track) => track.stop());
          mediaStream = undefined;
        }
      }

      function clearPreviousRecording() {
        if (audioUrl) {
          URL.revokeObjectURL(audioUrl);
          audioUrl = undefined;
        }
        recordingBlob = undefined;
        selectedDownloadUrl = undefined;
        selectedRecordingId = undefined;
        audioPlayer.removeAttribute("src");
        audioPlayer.hidden = true;
        audioName.hidden = true;
        previewPlaceholder.hidden = false;
        transcriptBox.value = "";
        liveTranscript = "";
        liveLanguage = undefined;
        downloadButton.disabled = true;
      }

      function samplesToPcm(samples) {
        const pcm = new Int16Array(samples.length);
        for (let index = 0; index < samples.length; index += 1) {
          const sample = Math.max(-1, Math.min(1, samples[index]));
          pcm[index] = sample < 0 ? sample * 32768 : sample * 32767;
        }
        return pcm.buffer;
      }

      function sendLiveChunk(samples) {
        if (liveSocket?.readyState === WebSocket.OPEN && samples.length > 0) {
          liveSocket.send(samplesToPcm(samples));
        }
      }

      function sendPendingLiveWindows() {
        if (liveChunkSeconds === undefined || liveOverlapSeconds === undefined) {
          return;
        }
        const chunkSize = Math.floor(liveSampleRate * liveChunkSeconds);
        const overlapSize = Math.floor(liveSampleRate * liveOverlapSeconds);
        while (pendingSamples.length >= chunkSize) {
          sendLiveChunk(pendingSamples.slice(0, chunkSize));
          pendingSamples = pendingSamples.slice(chunkSize - overlapSize);
        }
      }

      function captureLiveAudio(event) {
        const input = event.inputBuffer.getChannelData(0);
        event.outputBuffer.getChannelData(0).fill(0);
        pendingSamples.push(...input);
        sendPendingLiveWindows();
      }

      function disconnectLiveAudioCapture() {
        if (audioProcessor) {
          audioProcessor.removeEventListener("audioprocess", captureLiveAudio);
          audioProcessor.disconnect();
          audioProcessor = undefined;
        }
        if (liveSource) {
          liveSource.disconnect();
          liveSource = undefined;
        }
        if (audioContext) {
          audioContext.close();
          audioContext = undefined;
        }
      }

      async function startLiveTranscription() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) throw new Error("Live audio capture is unavailable.");

        audioContext = new AudioContextClass();
        await audioContext.resume();
        if (liveFinishing) return;
        liveSampleRate = audioContext.sampleRate;
        liveSource = audioContext.createMediaStreamSource(mediaStream);
        audioProcessor = audioContext.createScriptProcessor(4096, 1, 1);
        audioProcessor.addEventListener("audioprocess", captureLiveAudio);
        liveSource.connect(audioProcessor);
        audioProcessor.connect(audioContext.destination);

        const protocol = window.location.protocol === "https:" ? "wss:" : "ws:";
        const parameters = new URLSearchParams({
          sample_rate: String(liveSampleRate),
        });
        if (recordingLanguage) parameters.set("language", recordingLanguage);
        const socketUrl =
          `${protocol}//${window.location.host}/api/recordings/live?${parameters}`;
        liveSocket = new WebSocket(socketUrl);
        liveSocket.binaryType = "arraybuffer";
        liveClosePromise = new Promise((resolve) => {
          liveSocket.addEventListener("close", resolve, { once: true });
        });

        await new Promise((resolve, reject) => {
          const onReady = (event) => {
            const message = JSON.parse(event.data);
            if (message.type === "status" && message.status === "ready") {
              liveChunkSeconds = message.window_seconds;
              liveOverlapSeconds = message.overlap_seconds;
              liveSocket.removeEventListener("message", onReady);
              resolve();
            } else if (message.type === "error") {
              liveSocket.removeEventListener("message", onReady);
              reject(new Error(message.message || "Live transcription failed."));
            }
          };
          liveSocket.addEventListener("message", onReady);
          liveSocket.addEventListener(
            "error",
            () => reject(new Error("Could not connect to live transcription.")),
            { once: true },
          );
          liveSocket.addEventListener(
            "close",
            (event) => reject(new Error(`Live transcription closed (${event.code}).`)),
            { once: true },
          );
        });

        if (liveFinishing) return;

        liveSocket.addEventListener("close", (event) => {
          if (!liveFinishing && mediaRecorder?.state === "recording") {
            setStatus(
              `Live transcription connection closed unexpectedly (code ${event.code}).`,
              "error",
            );
          }
        });
        liveSocket.addEventListener("message", (event) => {
          const message = JSON.parse(event.data);
          if (message.type !== "transcript") return;
          liveTranscript = message.text;
          liveLanguage = message.language;
          transcriptBox.value = liveTranscript || "Listening...";
          if (mediaRecorder?.state === "recording") {
            setStatus("Live transcription active", "recording");
          }
        });
        liveSocket.addEventListener("error", () => liveSocket.close());
        sendPendingLiveWindows();
      }

      function finishLiveTranscription() {
        liveFinishing = true;
        disconnectLiveAudioCapture();
        const liveReady =
          liveChunkSeconds !== undefined &&
          liveOverlapSeconds !== undefined &&
          liveSocket?.readyState === WebSocket.OPEN;
        if (liveReady) {
          sendPendingLiveWindows();
        }
        if (liveReady && pendingSamples.length) {
          sendLiveChunk(pendingSamples);
        }
        pendingSamples = [];

        if (!liveReady) {
          if (
            liveSocket?.readyState === WebSocket.CONNECTING ||
            liveSocket?.readyState === WebSocket.OPEN
          ) {
            liveSocket.close();
          }
          return liveClosePromise || Promise.resolve();
        }
        liveSocket.send(JSON.stringify({ type: "stop" }));
        return liveClosePromise || Promise.resolve();
      }

      function handleLiveTranscriptionFailure(error) {
        disconnectLiveAudioCapture();
        pendingSamples = [];
        if (
          liveSocket?.readyState === WebSocket.CONNECTING ||
          liveSocket?.readyState === WebSocket.OPEN
        ) {
          liveSocket.close();
        }
        liveSocket = undefined;
        if (!liveFinishing && mediaRecorder?.state === "recording") {
          setStatus(
            `Live transcription unavailable: ${error.message} Recording will still be saved.`,
            "recording",
          );
        }
      }

      function getFileExtension(mimeType) {
        if (mimeType.includes("ogg")) return "ogg";
        if (mimeType.includes("mp4")) return "m4a";
        return "webm";
      }

      function formatTimestamp(value) {
        return new Date(value).toLocaleString();
      }

      function setPreview(audioSource, title, downloadUrl) {
        audioPlayer.src = audioSource;
        audioPlayer.hidden = false;
        audioName.textContent = title;
        audioName.hidden = false;
        previewPlaceholder.hidden = true;
        selectedDownloadUrl = downloadUrl;
        downloadButton.disabled = false;
      }

      function renderRecordings(recordings) {
        recordingsList.replaceChildren();

        if (recordings.length === 0) {
          const message = document.createElement("p");
          message.className = "recordings-message";
          message.textContent = "No saved recordings yet.";
          recordingsList.append(message);
          return;
        }

        for (const recording of recordings) {
          const item = document.createElement("button");
          item.className = "recording-item";
          item.type = "button";
          item.setAttribute("aria-current", String(recording.id === selectedRecordingId));

          const timestamp = document.createElement("span");
          timestamp.textContent = formatTimestamp(recording.created_at);
          const action = document.createElement("span");
          action.textContent = "Play";
          item.append(timestamp, action);
          item.addEventListener("click", () => {
            if (audioUrl) {
              URL.revokeObjectURL(audioUrl);
              audioUrl = undefined;
            }
            recordingBlob = undefined;
            selectedRecordingId = recording.id;
            setPreview(
              recording.audio_url,
              formatTimestamp(recording.created_at),
              recording.download_url,
            );
            transcriptBox.value =
              recording.transcript || "No transcript saved for this recording.";
            setStatus("Playing a saved recording", "ready");
            renderRecordings(recordings);
          });
          recordingsList.append(item);
        }
      }

      async function loadRecordings() {
        const response = await fetch("/api/recordings");
        if (!response.ok) throw new Error("Could not load saved recordings.");
        const recordings = await response.json();
        renderRecordings(recordings);
        return recordings;
      }

      async function responseError(response) {
        const responseBody = await response.text();
        try {
          const problem = JSON.parse(responseBody);
          if (problem.detail) return problem.detail;
        } catch {
          return `Server returned HTTP ${response.status}. Check the Uvicorn terminal for details.`;
        }
        return `Server returned HTTP ${response.status}. Check the Uvicorn terminal for details.`;
      }

      async function transcribeRecording(recordingId, language) {
        const isSelected = () => selectedRecordingId === recordingId;
        if (isSelected() && !transcriptBox.value) {
          transcriptBox.value = "Loading speech model and transcribing...";
        }
        if (isSelected()) setStatus("Finalizing transcript...", "recording");

        const languageParameter = language
          ? `?language=${encodeURIComponent(language)}`
          : "";
        const response = await fetch(
          `/api/recordings/${recordingId}/transcribe${languageParameter}`,
          {
            method: "POST",
          },
        );
        if (!response.ok) throw new Error(await responseError(response));

        const result = await response.json();
        if (isSelected()) {
          transcriptBox.value = result.text || "No speech detected.";
        }
        try {
          await loadRecordings();
        } catch (error) {
          if (isSelected()) {
            setStatus(
              `Transcription ready, but the saved list could not refresh: ${error.message}`,
              "error",
            );
          }
          return;
        }
        if (isSelected()) {
          setStatus(
            result.text ? "Transcription complete" : "No speech detected",
            "ready",
          );
        }
      }

      function waitForLiveDrain() {
        if (!liveFinishPromise) return Promise.resolve();
        let timeoutId;
        const outcome = Promise.race([
          liveFinishPromise.then(
            () => ({ status: "drained" }),
            (error) => ({ status: "failed", error }),
          ),
          new Promise((resolve) => {
            timeoutId = setTimeout(
              () => resolve({ status: "timeout" }),
              4000,
            );
          }),
        ]);
        return outcome.then((result) => {
          clearTimeout(timeoutId);
          if (result.status === "timeout") {
            if (
              liveSocket?.readyState === WebSocket.CONNECTING ||
              liveSocket?.readyState === WebSocket.OPEN
            ) {
              liveSocket.close();
            }
            setStatus(
              "Finalizing... Live transcript may be incomplete.",
              "recording",
            );
          } else if (result.status === "failed") {
            setStatus(
              `Finalizing... Live transcription drain failed: ${result.error.message}`,
              "recording",
            );
          }
        });
      }

      async function saveRecording(
        blob,
        durationSeconds,
        transcript,
        language,
        transcriptionLanguage,
      ) {
        const extension = getFileExtension(blob.type);
        const formData = new FormData();
        formData.append(
          "file",
          new File([blob], `recording.${extension}`, {
            type: blob.type || "audio/webm",
          }),
        );
        formData.append("duration_seconds", String(durationSeconds));
        if (transcript) formData.append("transcript", transcript);
        if (language) formData.append("language", language);

        const response = await fetch("/api/recordings", {
          method: "POST",
          body: formData,
        });
        if (!response.ok) {
          throw new Error(await responseError(response));
        }

        const recording = await response.json();
        selectedRecordingId = recording.id;
        if (audioUrl) URL.revokeObjectURL(audioUrl);
        audioUrl = undefined;
        setPreview(
          recording.audio_url,
          formatTimestamp(recording.created_at),
          recording.download_url,
        );
        try {
          await loadRecordings();
        } catch (error) {
          setStatus(
            `Recording saved, but the saved list could not refresh: ${error.message}`,
            "error",
          );
        }
        transcriptBox.value = transcript || "";
        setStatus("Recording saved. Finalizing transcript in the background...", "recording");
        void transcribeRecording(recording.id, transcriptionLanguage).catch((error) => {
          if (selectedRecordingId !== recording.id) return;
          if (transcript) {
            transcriptBox.value = transcript;
            setStatus(
              `Recording and live transcript saved, but final transcription failed: ${error.message}`,
              "error",
            );
          } else {
            transcriptBox.value = "Transcription failed. The audio recording is saved.";
            setStatus(
              `Recording saved, but transcription failed: ${error.message}`,
              "error",
            );
          }
        });
      }

      startButton.addEventListener("click", async () => {
        if (!navigator.mediaDevices?.getUserMedia) {
          setStatus("Microphone recording requires a supported browser on localhost or HTTPS.", "error");
          return;
        }
        if (typeof MediaRecorder === "undefined") {
          setStatus("Audio recording is not supported by this browser.", "error");
          return;
        }

        startButton.disabled = true;
        languageSelect.disabled = true;
        setStatus("Requesting microphone access...", "ready");
        const selectedLanguage = languageSelect.value || undefined;

        try {
          mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const preferredType = [
            "audio/webm;codecs=opus",
            "audio/webm",
            "audio/ogg;codecs=opus",
            "audio/mp4",
          ].find((type) => MediaRecorder.isTypeSupported(type));

          mediaRecorder = preferredType
            ? new MediaRecorder(mediaStream, { mimeType: preferredType })
            : new MediaRecorder(mediaStream);

          clearPreviousRecording();
          recordingChunks = [];
          pendingSamples = [];
          recordingDurationSeconds = undefined;
          liveFinishPromise = undefined;
          liveFinishing = false;
          liveSocket = undefined;
          liveClosePromise = undefined;
          liveChunkSeconds = undefined;
          liveOverlapSeconds = undefined;
          recordingLanguage = selectedLanguage;
          mediaRecorder.addEventListener("dataavailable", (event) => {
            if (event.data.size > 0) recordingChunks.push(event.data);
          });
          mediaRecorder.addEventListener("error", () => {
            clearInterval(timerInterval);
            finishLiveTranscription();
            stopTracks();
            stopButton.disabled = true;
            startButton.disabled = false;
            languageSelect.disabled = false;
            setStatus("Recording failed. Please try again.", "error");
          });
          mediaRecorder.addEventListener("stop", async () => {
            clearInterval(timerInterval);
            stopTracks();
            stopButton.disabled = true;
            await waitForLiveDrain();

            recordingBlob = new Blob(recordingChunks, {
              type: mediaRecorder.mimeType || "audio/webm",
            });
            if (recordingBlob.size === 0) {
              setStatus("No audio was captured. Please try again.", "error");
              startButton.disabled = false;
              languageSelect.disabled = false;
              return;
            }

            const extension = getFileExtension(recordingBlob.type);
            audioUrl = URL.createObjectURL(recordingBlob);
            selectedRecordingId = undefined;
            setPreview(audioUrl, `Recording.${extension}`, audioUrl);
            startButton.disabled = true;
            setStatus("Saving recording...", "ready");
            try {
              await saveRecording(
                recordingBlob,
                recordingDurationSeconds ??
                  Math.floor((Date.now() - startedAt) / 1000),
                liveTranscript,
                liveLanguage,
                recordingLanguage,
              );
            } catch (error) {
              setStatus(
                `Save failed: ${error.message} The audio is only available in this browser session.`,
                "error",
              );
            } finally {
              startButton.disabled = false;
              languageSelect.disabled = false;
            }
          });

          mediaRecorder.start(1500);
          startedAt = Date.now();
          timerElement.textContent = "00:00";
          timerInterval = setInterval(updateTimer, 250);
          stopButton.disabled = false;
          setStatus("Recording...", "recording");
          void startLiveTranscription().catch(handleLiveTranscriptionFailure);
        } catch (error) {
          stopTracks();
          startButton.disabled = false;
          languageSelect.disabled = false;
          const message =
            error.name === "NotAllowedError"
              ? "Microphone access was denied. Allow microphone access and try again."
              : error.name === "NotFoundError"
                ? "No microphone was found."
                : "Could not start recording. Check your microphone and try again.";
          setStatus(message, "error");
        }
      });

      stopButton.addEventListener("click", () => {
        if (mediaRecorder?.state === "recording") {
          recordingDurationSeconds = Math.floor(
            (Date.now() - startedAt) / 1000,
          );
          stopButton.disabled = true;
          setStatus("Finalizing...", "recording");
          liveFinishPromise = finishLiveTranscription();
          mediaRecorder.stop();
          updateTimer();
        }
      });

      downloadButton.addEventListener("click", () => {
        if (!selectedDownloadUrl) return;
        const link = document.createElement("a");
        link.href = selectedDownloadUrl;
        if (recordingBlob && selectedDownloadUrl === audioUrl) {
          link.download = `recording.${getFileExtension(recordingBlob.type)}`;
        }
        document.body.append(link);
        link.click();
        link.remove();
      });

      loadRecordings().catch(() => {
        const message = document.createElement("p");
        message.className = "recordings-message";
        message.textContent = "Could not load saved recordings. Refresh to try again.";
        recordingsList.replaceChildren(message);
      });

      window.addEventListener("beforeunload", () => {
        clearInterval(timerInterval);
        stopTracks();
        if (audioUrl) URL.revokeObjectURL(audioUrl);
      });
    </script>
  </body>
</html>
